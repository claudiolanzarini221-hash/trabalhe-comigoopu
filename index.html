<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="utf-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto SaaS</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/site-icon.svg">
    <link rel="apple-touch-icon" href="/favicon.png">
    <script type="module" src="js/index-DMG-jKOm.js"></script>
    <link rel="stylesheet" crossorigin="" href="css/index-BqXY08WV.css">
    <style>
      #back-to-form-btn {
        display: none;
        position: fixed;
        top: 14px;
        left: 16px;
        z-index: 99999;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.2s;
        text-decoration: none;
      }
      #back-to-form-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Botão para voltar ao formulário caso esteja no painel (#claudiao) -->
    <a id="back-to-form-btn" href="/">← Voltar ao Formulário</a>

    <script>
      (function() {
        const backBtn = document.getElementById('back-to-form-btn');

        function checkRoute() {
          const isClaudiao = (window.location.hash || '').toLowerCase().includes('claudiao') || 
                             (window.location.pathname || '').toLowerCase().includes('claudiao') || 
                             (window.location.pathname || '').includes('/ujac');
          if (backBtn) {
            backBtn.style.display = isClaudiao ? 'block' : 'none';
          }
        }

        checkRoute();
        window.addEventListener('popstate', checkRoute);
        window.addEventListener('hashchange', checkRoute);

        if (backBtn) {
          backBtn.addEventListener('click', function(e) {
            e.preventDefault();
            try {
              window.location.hash = '';
              window.history.pushState({}, '', '/');
              window.dispatchEvent(new PopStateEvent('popstate'));
              window.dispatchEvent(new HashChangeEvent('hashchange'));
            } catch(err) {}
            window.location.href = '/';
          });
        }
      })();
    </script>
</body></html>
